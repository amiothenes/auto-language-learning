    <path d="M58 86 C58 92 70 92 70 86" fill="none" stroke="#183A37" stroke-width="2.4" stroke-linecap="round"></path>
    <line x1="55" y1="60" x2="55" y2="72" stroke="#183A37" stroke-width="1.6" opacity="0.3" stroke-linecap="round"></line>
