      <rect x="38" y="48" width="54" height="14" rx="2.5" fill="#FAF9F5" stroke="#183A37" stroke-width="2.4"></rect>
      <line x1="45" y1="50" x2="45" y2="60" stroke="#183A37" stroke-width="2" opacity="0.5"></line>
      <line x1="51" y1="55" x2="87" y2="55" stroke="#183A37" stroke-width="1.6" opacity="0.3"></line>
