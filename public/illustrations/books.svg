      <line x1="41" y1="82" x2="41" y2="92" stroke="#183A37" stroke-width="2" opacity="0.5"></line>
      <line x1="47" y1="87" x2="91" y2="87" stroke="#183A37" stroke-width="1.6" opacity="0.3"></line>
    </g>
    <g transform="rotate(2 64 64)">
