      <rect x="30" y="64" width="68" height="14" rx="2.5" fill="#FAF9F5" stroke="#183A37" stroke-width="2.4"></rect>
      <line x1="37" y1="66" x2="37" y2="76" stroke="#183A37" stroke-width="2" opacity="0.5"></line>
      <line x1="43" y1="71" x2="93" y2="71" stroke="#183A37" stroke-width="1.6" opacity="0.3"></line>
    </g>
